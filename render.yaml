services:
  - type: web
    name: consulting-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /admin
    envVars:
      - key: ADMIN_PASSWORD
        value: mozumder123
      - key: DB_DIR
        value: /data
      # Set this in the Render dashboard to a free managed Postgres connection
      # string (e.g. from Neon) so submissions persist permanently across
      # restarts and redeploys. Without it, data lives in an ephemeral SQLite
      # file that Render's free tier wipes on every spin-down.
      - key: DATABASE_URL
        sync: false
